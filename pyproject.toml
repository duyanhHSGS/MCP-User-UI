[project]
name = "mcp-user-ui"
version = "0.1.0"
description = "Human-operated Flet playground for remote Streamable HTTP MCP servers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Flet developer", email = "you@example.com" }]
dependencies = ["flet[all]==1.1.0", "httpx==0.28.1", "pillow==11"]

[dependency-groups]
dev = ["pytest==8.4.2", "pyright==1.1.414", "ruff==0.9.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
]

[tool.flet]
desktop_flavor = "light"                      # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "mcp-user-ui"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

[tool.pyright]
# Flat src/ layout: the same import root used by Flet, pytest, and runtime.
extraPaths = ["src"]
